<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/estilos.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego </title>
</head>
<body>
    <div class="gameover"></div>
    <div class="mensajeover">
        <button id="reiniciar">reiniciar</button>
    </div>

    <!-- Desde aquí inicié el "up grade" por Carlos Monterrosa -->
    <!-- Mensaje de bienvenida que aparece al ingresar el nombre y dar clic en Empezar -->
    <div id="bienvenida" style="display:none;">
        <p id="textoBienvenida"></p>
        <p class="mensaje-tigre">¡Acepeda se lo comió el tigre! 🐯 jajaja</p>
    </div>
    <!-- Finaliza aquí -->

    <button class="iniciar">👌Iniciar Juego </button>
    <section class="contenido">
        <article class="presentacion">
            Nombre
            <input type="text" id="nombre">
            <br>
            <button id="empezar">Empezar Juego</button>
        </article>
        <div id="tiempo"></div>
        <div id="juego">
            Numero 1:
            <input type="number" id="numero1" readonly> 
            ➕
            Numero 2:
            <input type="number" id="numero2" readonly> <br>
            Respuesta:
            <input type="number" id="respuestausuario"> <br>
            <button id="responder">Responder la suma</button>
        </div>
    </section>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
